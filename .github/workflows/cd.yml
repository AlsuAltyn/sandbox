name: CD

on:
  #push:
    #branches: [ "**" ]
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version to deploy (for rollback)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.VERSION }}" ]; then
            echo "version=${{ github.event.inputs.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Nexus закомментирован ---
      # - name: Configure Docker insecure registry
      #   run: |
      #     sudo mkdir -p /etc/docker
      #     echo '{"insecure-registries":["${{ secrets.NEXUS_HOST }}"]}' | sudo tee /etc/docker/daemon.json
