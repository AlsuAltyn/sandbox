services:
  backend:
    # Используем переменные, которые будут формироваться в пайплайне
    image: ${REPOSITORY_BACKEND}:${IMAGE_TAG}
    container_name: sandbox-backend
    environment:
      - PORT=8081
      - ENV=production
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - sandbox-net

  frontend:
    image: ${REPOSITORY_FRONTEND}:${IMAGE_TAG}
    container_name: sandbox-frontend
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    ports:
      - "80:8888" # Предполагаю, что фронт у вас слушает 8888, а наружу отдаем на 80
    restart: unless-stopped
    networks:
      - sandbox-net

networks:
  sandbox-net:
    driver: bridge