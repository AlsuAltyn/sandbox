apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backend
  labels:
    app: sandbox-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-backend
  template:
    metadata:
      labels:
        app: sandbox-backend
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PORT
              value: "8081"
            - name: ENV
              value: "production"
            - name: DB_ENABLED
              value: {{ .Values.db.enabled | quote }}
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_USER
              value: {{ .Values.db.user | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.db.password | quote }}
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.db.sslmode | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}