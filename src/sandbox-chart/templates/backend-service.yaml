apiVersion: v1
kind: Service
metadata:
  name: sandbox-backend
  labels:
    app: sandbox-backend
spec:
  type: {{ .Values.backend.service.type | default "ClusterIP" }}
  selector:
    app: sandbox-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port | default 8081 }}
      targetPort: 8081
      protocol: TCP
      {{- if eq .Values.backend.service.type "NodePort" }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
