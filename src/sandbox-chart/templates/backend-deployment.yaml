apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backend
  labels:
    app: sandbox-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-backend
  template:
    metadata:
      labels:
        app: sandbox-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PORT
              value: "8081"
            - name: ENV
              value: "production"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}