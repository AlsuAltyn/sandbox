apiVersion: v1
kind: Service
metadata:
  name: sandbox-frontend
  labels:
    app: sandbox-frontend
spec:
  type: {{ .Values.frontend.service.type | default "ClusterIP" }}
  selector:
    app: sandbox-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port | default 8888 }}
      targetPort: 8888
      protocol: TCP
      {{- if eq .Values.frontend.service.type "NodePort" }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
