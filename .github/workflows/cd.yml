name: CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (тег образа)"
        required: true
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install sandbox ./sandbox-chart -n sandbox \
            --set backend.tag=${{ github.event.inputs.version }} \
            --set frontend.tag=${{ github.event.inputs.version }}

      - name: Verify
        run: kubectl get pods -n sandbox