backend:
  image: ghcr.io/alsualtyn/sandbox/sandbox-backend
  tag: latest
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:                        
    type: ClusterIP 
    port: 8081
                  
    

frontend:
  image: ghcr.io/alsualtyn/sandbox/sandbox-frontend
  tag: latest
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:                     
    type: ClusterIP 
    port: 8888
    

db:
  enabled: true
  host: sandbox-postgres      
  port: 5432
  user: postgres
  password: postgres         
  name: postgres
  sslmode: disable

postgres:
  image: postgres:15-alpine
  storage: 1Gi  


ingress:
  enabled: true
  className: nginx


