apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: altinguzina.denisereda.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandbox-frontend
                port:
                  number: 8888