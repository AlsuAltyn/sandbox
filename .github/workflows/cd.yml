      #     driver-opts: network=host
      # -----------------------------

      - name: Login to GitHub Container Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # --- Nexus закомментирован ---
      # - name: Login to Nexus Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.NEXUS_HOST }}
      #     username: ${{ secrets.NEXUS_REPO_USER }}
      #     password: ${{ secrets.NEXUS_REPO_PASS }}
      # -----------------------------

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
          # --- Nexus закомментирован ---
          #   ${{ secrets.NEXUS_HOST }}/altynguzina-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}
          # -----------------------------
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

