name: CD

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version to deploy (for rollback)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Устанавливаем и настраиваем yc CLI
      - name: Configure yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          # Установка yc (если не установлен)
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          
          # Сохраняем ключ сервисного аккаунта
          install -m 600 /dev/null "$RUNNER_TEMP/yc-sa-key.json"
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-sa-key.json"
          
          # Настройка профиля
          yc config profile create ci
          yc config set service-account-key "$RUNNER_TEMP/yc-sa-key.json"
          yc config set folder-id "$YC_FOLDER_ID"

      # 2. Получаем kubeconfig для кластера
      - name: Get kubeconfig
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          yc managed-kubernetes cluster get-credentials <r8s-kluster-933> --external --force

      # 3. Настраиваем доступ к GHCR (создаем секрет в кластере)
      - name: Create GHCR secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n sandbox --dry-run=client -o yaml | kubectl apply -f -

      # 4. Устанавливаем Helm
      - name: Setup Helm
        uses: azure/setup-helm@v3

      # 5. Деплой через Helm
      - name: Deploy with Helm
        run: |
          helm upgrade --install sandbox ./src/sandbox-chart -n sandbox \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/sandbox-backend \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/sandbox-frontend \
            --set backend.tag=${{ github.event.inputs.VERSION }} \
            --set frontend.tag=${{ github.event.inputs.VERSION }}

      # 6. Проверка
      - name: Verify
        run: kubectl get pods -n sandbox